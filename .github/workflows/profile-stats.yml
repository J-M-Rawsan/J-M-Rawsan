name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 3:00 AM UTC
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: J-M-Rawsan
          output: ./profile/trophy.svg
          theme: tokyonight
          no-frame: true
          column: 4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=J-M-Rawsan&theme=tokyonight&hide_border=true&background=020a0e&ring=00d4ff&fire=00ff88&currStreakLabel=00d4ff&sideLabels=c8f0ff&dates=3a7a8a
          path: ./profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg profile/streak.svg
          git commit -m "chore: update profile stats [skip ci]" || exit 0
          git push
